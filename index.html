
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Your simple space to create and manage notes.</p>
  </header>

  <main>
    <section aria-labelledby="notes-heading">
      <h2 id="notes-heading">Your Notes</h2>
      <button id="load-btn" type="button">Load Notes</button>
      <p id="status" role="status" aria-live="polite">Ready to load notes.</p>
      <ul id="notes-list"></ul>
    </section>

    <section aria-labelledby="create-heading">
      <h2 id="create-heading">Create a Note</h2>
      <form id="note-form">
        <label for="title-input">Note title</label>
        <input
          id="title-input"
          name="title"
          type="text"
          maxlength="100"
          required
          placeholder="Enter a title (max 100 characters)"
        >

        <label for="body-input">Note content</label>
        <textarea
          id="body-input"
          name="body"
          rows="5"
          required
          placeholder="Write your note here..."
        ></textarea>

        <button id="submit-btn" type="submit">Create Note</button>
      </form>
    </section>
  </main>

  <footer>
    <p>QuickNotes — Web Development Foundation &amp; System Design</p>
  </footer>
</body>
</html>
